name: Deploy to GitHub Pages

# Builds the HTML pages from data/*.json and src/ (node tools/build.mjs, no dependencies) and
# publishes the site.
#
# This repository is the frozen demo: it is deployed and stays as it is, so the workflow no longer
# runs on a push and the published site cannot change by accident. Work continues in netherfield-v2,
# where the same workflow runs on every push again. Run this one by hand (Actions -> Deploy to
# GitHub Pages -> Run workflow) only to restore the demo if it is ever needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pages from data
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
